name: Downloads badge

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: downloads-badge
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out badges branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$url" badges >/dev/null 2>&1; then
            git clone --depth 1 --branch badges "$url" badges-data
          else
            mkdir badges-data
            cd badges-data
            git init -q -b badges
            git remote add origin "$url"
          fi

      - name: Update counts
        run: python3 .github/scripts/downloads_badge.py ambidose badges-data

      - name: Commit and push
        working-directory: badges-data
        run: |
          git add history.json downloads.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -q -m "Update download counts"
            git push origin HEAD:badges
          fi
